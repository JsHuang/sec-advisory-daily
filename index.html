<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 安全公告日报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
            border-bottom: 1px solid #30363d;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 { font-size: 2em; color: #f0f6fc; margin-bottom: 8px; }
        header p { color: #8b949e; font-size: 1em; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        
        .report-list { display: grid; gap: 16px; }
        .report-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            transition: border-color 0.2s;
        }
        .report-card:hover { border-color: #58a6ff; }
        .report-card h3 { margin-bottom: 12px; }
        .report-card h3 a { color: #58a6ff; text-decoration: none; font-size: 1.2em; }
        .report-card h3 a:hover { text-decoration: underline; }
        .report-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 0.8em; font-weight: 600;
        }
        .badge-critical { background: #da363322; color: #f85149; border: 1px solid #da363344; }
        .badge-high { background: #d2992222; color: #d29922; border: 1px solid #d2992244; }
        .badge-info { background: #388bfd22; color: #58a6ff; border: 1px solid #388bfd44; }
        .report-desc { color: #8b949e; font-size: 0.9em; line-height: 1.5; }
        
        .empty {
            text-align: center; padding: 60px 20px; color: #8b949e;
        }
        .empty p { font-size: 1.1em; margin-top: 12px; }
        
        footer {
            text-align: center; padding: 30px 20px; color: #484f58;
            border-top: 1px solid #21262d; margin-top: 40px;
            font-size: 0.85em;
        }
        footer a { color: #58a6ff; text-decoration: none; }
        
        .loading { text-align: center; padding: 40px; color: #8b949e; }
    </style>
</head>
<body>
    <header>
        <h1>🛡️ GitHub 安全公告日报</h1>
        <p>每日自动监控 Critical & High 级别安全公告 · 数据来源 GitHub Advisory Database</p>
    </header>
    
    <div class="container">
        <div id="loading" class="loading">加载中...</div>
        <div id="reportList" class="report-list" style="display:none;"></div>
    </div>
    
    <footer>
        <p>每日 08:10 自动生成 · <a href="https://github.com/JsHuang/sec-advisory-daily">GitHub 仓库</a></p>
    </footer>

    <script>
    async function loadIndex() {
        try {
            const resp = await fetch('data/reports.json?t=' + Date.now());
            if (!resp.ok) throw new Error('no data');
            const data = await resp.json();
            renderList(data.reports || []);
        } catch(e) {
            document.getElementById('loading').innerHTML = '<p>暂无报告数据</p><p style="margin-top:8px;font-size:0.9em">首次报告将在明天 08:10 生成</p>';
        }
    }
    
    function renderList(reports) {
        document.getElementById('loading').style.display = 'none';
        const el = document.getElementById('reportList');
        el.style.display = 'grid';
        
        if (!reports.length) {
            el.innerHTML = '<div class="empty"><p>暂无报告</p></div>';
            return;
        }
        
        el.innerHTML = reports.map(r => {
            const s = r.stats || {};
            return `
            <div class="report-card">
                <h3><a href="${r.url}">${r.title || r.date}</a></h3>
                <div class="report-meta">
                    <span class="badge badge-critical">Critical: ${s.critical || 0}</span>
                    <span class="badge badge-high">High: ${s.high || 0}</span>
                    <span class="badge badge-info">Star≥5k: ${s.star5k || 0}</span>
                    <span class="badge badge-info">含PoC/分析: ${s.with_poc || 0}</span>
                </div>
                <div class="report-desc">${r.summary || ''}</div>
            </div>`;
        }).join('');
    }
    
    loadIndex();
    </script>
</body>
</html>
